 function check(task,draft={}){
  if(task.type==="choice"){if(draft.choice==null)return{empty:true,message:"Алдымен бір жауапты таңда."};if(!task.choices.some(o=>o.value===String(draft.choice)))return{empty:true,message:"Берілген жауаптардың бірін таңда."};return{correct:String(draft.choice)===task.answer};}

 }
 function newProfile(id,route){return{id,route,started:false,records:{},drafts:{},currentIndex:0,remaining:DURATION,paused:true,lastTickAt:0,reflection:null,completedAt:null,updatedAt:new Date().toISOString(),bonusStarted:false};}
 function recordFor(p,id){return p.records[id]||(p.records[id]={attempts:0,hints:0,firstCorrect:null,solved:false});}
 function submit(p,task,draft){const verdict=check(task,draft);if(verdict.empty)return verdict;const r=recordFor(p,task.id);if(r.solved)return{correct:true,already:true};if(r.attempts===0)r.firstCorrect=verdict.correct;r.attempts++;if(verdict.correct)r.solved=true;p.updatedAt=new Date().toISOString();return verdict;}
 function summary(p){const tasks=makeTasks(p.id,p.route),core=tasks.slice(0,CORE_COUNT),done=core.filter(t=>p.records[t.id]?.solved).length;const first=core.filter(t=>p.records[t.id]?.firstCorrect===true).length;const help=core.filter(t=>(p.records[t.id]?.hints||0)>0).length;const finals=ORDER.map((op,i)=>({op,record:p.records["f"+(i+1)]||null}));return{done,first,help,finals,finished:done===CORE_COUNT&&!!p.reflection,bonus:tasks.slice(CORE_COUNT).filter(t=>p.records[t.id]?.solved).length};}
 function sanitizeProfile(raw){
  if(!raw||!Number.isInteger(raw.id)||raw.id<1||raw.id>17||!ROUTES[raw.route])throw Error("Профиль нөмірі немесе бағыты дұрыс емес.");const p=newProfile(raw.id,raw.route),valid=makeTasks(raw.id,raw.route),allowed=new Set(valid.map(t=>t.id));p.started=!!raw.started;p.remaining=Math.max(0,Math.min(DURATION,Number(raw.remaining)||0));p.paused=true;p.lastTickAt=0;p.currentIndex=Math.max(0,Math.min(31,Number.isInteger(raw.currentIndex)?raw.currentIndex:0));p.bonusStarted=!!raw.bonusStarted;
  const time=Date.parse(raw.updatedAt);p.updatedAt=Number.isFinite(time)&&time<=Date.now()+86400000?new Date(time).toISOString():new Date().toISOString();
  if(raw.records&&typeof raw.records==="object")for(const [id,r]of Object.entries(raw.records)){if(!allowed.has(id)||!r||typeof r!=="object")continue;p.records[id]={attempts:Math.min(999,Math.max(0,Math.floor(Number(r.attempts)||0))),hints:Math.min(3,Math.max(0,Math.floor(Number(r.hints)||0))),firstCorrect:typeof r.firstCorrect==="boolean"?r.firstCorrect:null,solved:r.solved===true};}
  if(raw.drafts&&typeof raw.drafts==="object")for(const[id,d]of Object.entries(raw.drafts)){if(!allowed.has(id)||!d||typeof d!=="object")continue;p.drafts[id]={choice:typeof d.choice==="string"?d.choice.slice(0,60):undefined,A:["0","1"].includes(d.A)?d.A:undefined,B:["0","1"].includes(d.B)?d.B:undefined,trace:Array.isArray(d.trace)?d.trace.slice(0,4).map(x=>["0","1"].includes(x)?x:""):undefined};}
  if(raw.reflection&&typeof raw.reflection==="object"&&ORDER.includes(raw.reflection.op)){p.reflection={op:raw.reflection.op,text:String(raw.reflection.text||"").slice(0,1500),example:String(raw.reflection.example||"").slice(0,1500)};if(!p.reflection.text.trim()||!p.reflection.example.trim())p.reflection=null;}
  p.completedAt=p.reflection&&valid.slice(0,CORE_COUNT).every(t=>p.records[t.id]?.solved)?String(raw.completedAt||p.updatedAt).slice(0,40):null;return p;
 }
 function readExport(raw){if(raw?.kind!=="logika-stansiya-results"||raw.version!==1||raw.objective!=="9.2.1.1"||!Array.isArray(raw.profiles)||raw.profiles.length<1||raw.profiles.length>17)throw Error("Бұл ойынның нәтиже файлын таңда.");const p=raw.profiles.map(sanitizeProfile);if(new Set(p.map(x=>x.id)).size!==p.length)throw Error("Файлда оқушы нөмірі қайталанған.");return p;}
 return{OPS,ORDER,ROUTES,STAGES,CORE_COUNT,DURATION,evaluate,format,steps,makeTasks,check,newProfile,recordFor,submit,summary,sanitizeProfile,readExport};
})();
</script>
<script id="logic-app">
"use strict";
(()=>{

const OBJECTIVE="логикалық пікірдің ақиқаттығын анықтау үшін логикалық амалдарды (дизъюнкция, конъюнкция, инверсия, шектеуші немесе (XOR), импликация (ұстану), эквиваленттілік (тепе-теңдік)) қолдану";
let state={profiles:{},selected:1,route:"explorer"},page="home",viewIndex=0,feedback=null,teacherTab="plan",teacherId=0,storageAvailable=true,toastHandle;

const e=escape;
function load(){try{const raw=JSON.parse(localStorage.getItem(STORAGE)||"null");if(raw?.version===1){for(const x of raw.profiles||[]){try{const p=L.sanitizeProfile(x);state.profiles[p.id]=p;}catch{}}state.selected=Number.isInteger(raw.selected)&&raw.selected>=1&&raw.selected<=17?raw.selected:1;state.route=L.ROUTES[raw.route]?raw.route:"explorer";}}catch{storageAvailable=false;}}

function profile(){return state.profiles[state.selected]||null;}
function tasks(){const p=profile();return L.makeTasks(p.id,p.route);}
function tick(){const p=profile();if(!p||!p.started||p.paused)return;const now=Date.now();if(p.lastTickAt){p.remaining=Math.max(0,p.remaining-(now-p.lastTickAt));}p.lastTickAt=now;if(p.remaining===0){p.paused=true;toast("Ұсынылған уақыт аяқталды. Тапсырманы аяқтап, нәтижеңді сақтай аласың.");}updateTimer();}
function pauseCurrent(){tick();const p=profile();if(p){p.paused=true;p.lastTickAt=0;save();}updateTimer();}
function updateTimer(){const p=profile(),ms=p?.started?p.remaining:L.DURATION,s=Math.ceil(ms/1000),txt=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");document.getElementById("timerText").textContent=txt;document.getElementById("pauseMark").textContent=p?.started&&p.paused?" Ⅱ":"";const b=document.getElementById("timerButton");b.classList.toggle("low",ms<300000);b.setAttribute("aria-label",p?.paused?"Таймерді жалғастыру":"Таймерді кідірту");}

ry="6" stroke="#c2a6ef" transform="rotate(-30 413 73)"/><circle cx="68" cy="270" r="6" fill="#d5fc78"/><g fill="#c6b7ea"><circle class="star" cx="84" cy="92" r="2"/><circle cx="421" cy="278" r="2"/><circle class="star" cx="319" cy="33" r="2"/><circle cx="58" cy="180" r="2"/><circle class="star" cx="456" cy="195" r="2"/><circle cx="197" cy="342" r="2"/></g><path d="M452 120V131M447 125H458M82 328V338M77 333H87" stroke="#8d7cba"/></svg><span class="station-label">6 МОДУЛЬ · 1 ОРТАҚ МИССИЯ</span></div>`;}
function renderHome(){page="home";const p=profile(),s=p?L.summary(p):null;const selectedRoute=p?.started?p.route:state.route;app.innerHTML=`<div class="page-enter"><section class="hero"><div><div class="eyebrow">Логикалық амалдар · Практикалық жұмыс</div><h1>Станцияны<br><span class="accent">қайта іске қос.</span></h1><p class="lead">Ғарыш станциясының логикалық жүйесі істен шықты. Алты модульді қалпына келтіріп, ақиқат сигналды Жерге жеткіз.</p><div class="hero-tags"><span class="pill lime">◷ 40 минуттық миссия</span><span class="pill">26 тапсырма + 6 қосымша</span><span class="pill">3 бағыт</span></div></div>${stationArt()}</section><section class="panel start-panel"><div class="section-top"><div><div class="step-label">МИССИЯҒА ДАЙЫНДЫҚ</div><h2>Өз нөмірің мен бағытыңды таңда</h2></div><span class="pill">9-сынып / 17 оқушы</span></div><div class="setup-grid"><div class="profile-box"><div><label class="field-label" for="studentSelect">Сынып тізіміндегі нөмірің</label><select id="studentSelect">${Array.from({length:17},(_,i)=>`<option value="${i+1}" ${state.selected===i+1?"selected":""}>Оқушы №${String(i+1).padStart(2,"0")}${state.profiles[i+1]?.started?" · сақталған":""}</option>`).join("")}</select></div><p class="profile-note">Басқа оқушының нөмірін алма. Әр нөмірде тапсырма мәндері өзгереді.${p?.started?`<br><br><span class="accent">Сақталған: ${s.done}/26 тапсырма.</span>`:""}</p></div><div><div class="routes" role="group" aria-label="Оқу бағыты">${Object.entries(L.ROUTES).map(([k,r])=>`<button class="route ${k===selectedRoute?"selected":""}" data-action="route" data-route="${k}" aria-pressed="${k===selectedRoute}" ${p?.started?"disabled":""}><span class="route-flag">${r.symbol}</span>${k===selectedRoute?'<span class="route-check">✓</span>':""}<strong>${r.name}</strong><span class="small">${r.text}</span></button>`).join("")}</div><p class="small muted" style="margin-top:12px">Барлық бағытта алты амал бар. Соңғы тексеру бәріне ортақ. Көмек сұрауға болады.</p></div></div><div class="start-bottom"><div class="small muted">${p?.started?`Бағыт: ${L.ROUTES[p.route].name}. Жалғастырғанда бұрынғы жауаптарың сақталады.`:"Алдымен қысқа нұсқаулықпен таныс. Таймер миссияны бастағанда қосылады."}</div><button class="btn primary launch" data-action="${p?.started?"resume":"intro"}">${p?.started?s.finished?"Қорытындыны ашу →":"Миссияны жалғастыру →":"Миссияны бастау →"}</button></div>${!storageAvailable?'<div class="notice">Браузерде автоматты сақтау қолжетімсіз. Нәтижеңді файлға жүктеп ал.</div>':""}${p?.started?'<button class="btn ghost danger" style="margin-top:15px" data-action="restart">Осы нөмірді жаңадан бастау</button>':""}</section><section class="roadmap" aria-label="Миссия бөлімдері">${L.STAGES.slice(0,4).map((s,i)=>`<div class="map-card"><div class="map-num"><span>0${i+1}</span><span>${s.time} МИН</span></div><strong>${s.name}</strong><p>${s.count} тапсырма · ${["Ақиқат пен жалғанды ажырат","Барлық алты амалды қолдан","Шарт пен сызбаны зертте","Біліміңді өзің тексер"][i]}</p></div>`).join("")}</section></div>`;updateTimer();}
function showModal(title,content){modal.innerHTML=`<div class="modal-head"><h2 id="modalTitle">${e(title)}</h2><button class="close" data-action="close" aria-label="Терезені жабу">×</button></div><div class="modal-body">${content}</div>`;if(!modal.open){if(typeof modal.showModal==="function")modal.showModal();else modal.setAttribute("open","");}}
function closeModal(){if(typeof modal.close==="function")modal.close();else modal.removeAttribute("open");}
function showIntro(){showModal("Бортқа қош келдің, зерттеуші!",`<p>Сен — станцияның логикалық жүйесін қалпына келтіретін инженерсің. Әр тапсырмада өз шешіміңді қабылда.</p><div class="lesson-list"><div class="lesson-row"><b>01</b><div><strong>Оқы → есепте → тексер</strong>1 — ақиқат, 0 — жалған. Алдымен өрнекті тетрадьқа есепте, содан кейін жауабыңды таңда.</div></div><div class="lesson-row"><b>02</b><div><strong>Қате — қайта ойлануға мүмкіндік</strong>Қате болса, түсіндірмені оқып, жауабыңды түзет. «Көмек» бірден толық жауапты ашпайды.</div></div><div class="lesson-row"><b>03</b><div><strong>Финал және рефлексия</strong>Алты амал бойынша жеке тексеруден өт. НЕМЕСЕ мен XOR айырмасын өз сөзіңмен түсіндір.</div></div></div><div class="teacher-note">Бағытың: <strong>${L.ROUTES[state.route].name}</strong>. Құралдар: браузер, тетрадь және қалам. Жылдамдыққа балл берілмейді. Таймер біткенде жауаптар бұғатталмайды.</div><div class="result-buttons"><button class="btn ghost" data-action="close">Әзірге артқа</button><button class="btn primary" data-action="start">Ұшуға дайынмын →</button></div>`);}
function start(){let p=L.newProfile(state.selected,state.route);p.started=true;p.paused=false;p.lastTickAt=Date.now();state.profiles[p.id]=p;viewIndex=0;feedback=null;page="game";closeModal();save();renderTask();scrollTop();}
function resume(){const p=profile();if(!p)return;p.paused=p.remaining===0;p.lastTickAt=p.paused?0:Date.now();save();if(L.summary(p).finished&&!p.bonusStarted){renderResults();}else{viewIndex=Math.min(p.currentIndex,31);if(viewIndex>=L.CORE_COUNT&&!p.bonusStarted)renderResults();else{page="game";feedback=null;renderTask();}}scrollTop();}
function stageNav(task){const ts=tasks(),p=profile(),furthest=ts.findIndex(t=>!p.records[t.id]?.solved),max=furthest===-1?31:furthest;return `<div class="stage-nav-wrap"><nav class="panel stage-nav" aria-label="Бөлімдер">${L.STAGES.filter(s=>s.id<4||p.bonusStarted).map(s=>{const start=ts.findIndex(t=>t.stage===s.id),group=ts.filter(t=>t.stage===s.id),n=group.filter(t=>p.records[t.id]?.solved).length;return `<button class="stage-button ${task.stage===s.id?"active":""} ${n===s.count?"done":""}" data-action="stage" data-index="${start}" ${start>max?"disabled":""} ${task.stage===s.id?'aria-current="step"':""}><span class="stage-number">${n===s.count?"✓":s.id+1}</span><span><strong>${s.name}</strong><small>${n}/${s.count} тапсырма</small></span></button>`;}).join("")}</nav><div class="aside-note">Тетрадьқа шешу жолын жаз. Қате болса, себебін тауып, қайта тексер.</div></div>`;}
function modules(){const p=profile(),s=L.summary(p),covered=new Set(tasks().filter(t=>p.records[t.id]?.solved).flatMap(t=>t.skills));return `<aside class="panel module-panel"><div class="eyebrow">Станция модульдері</div><div class="module-grid">${L.ORDER.map(k=>`<div class="module-tile ${covered.has(k)?"lit":""}"><span class="symbol">${L.OPS[k].symbol}</span><small>${L.OPS[k].short}</small></div>`).join("")}</div><p class="small muted">Амал қолданылғанда модуль жанады.</p><div class="mini-stat"><strong>${s.done}<span class="small muted"> / 26</span></strong>Негізгі тапсырмалар</div><div class="mini-stat">Бағыт<br><span class="accent">${L.ROUTES[p.route].name}</span></div></aside>`;}
function taskInput(task,r,d){const disabled=r.solved?"disabled":"";if(task.type==="choice")return `<div class="answers" role="group" aria-label="Жауап нұсқалары">${task.choices.map((o,i)=>`<button class="answer ${d.choice===o.value?"selected":""} ${r.solved&&o.value===task.answer?"correct":""} ${o.label.length>82?"wide":""}" data-action="choose" data-value="${e(o.value)}" aria-pressed="${d.choice===o.value}" ${disabled}><span class="choice-index">${i+1}</span><span>${e(o.label)}</span></button>`).join("")}</div>`;
 if(task.type==="trace")return `<div class="trace-rows">${task.parts.map((part,i)=>`<div class="trace-row"><label for="trace${i}">${e(L.format(part))}</label><select id="trace${i}" data-trace="${i}" ${disabled}><option value="">Таңда</option><option value="0" ${d.trace?.[i]==="0"?"selected":""}>0</option><option value="1" ${d.trace?.[i]==="1"?"selected":""}>1</option></select></div>`).join("")}</div>`;
 return `<div class="pill lime">Мақсатты нәтиже: ${task.target}</div><div class="circuit"><div class="switches">${["A","B"].map(v=>`<div class="switch-label"><span>${v}</span><span class="toggle" role="group" aria-label="${v} кірісі">${["0","1"].map(n=>`<button data-action="switch" data-var="${v}" data-value="${n}" class="${d[v]===n?"selected":""}" aria-pressed="${d[v]===n}" ${disabled}>${n}</button>`).join("")}</span></div>`).join("")}</div><div class="gate" aria-label="${L.OPS[task.operator].name}">${L.OPS[task.operator].symbol}</div><div class="output"><small>ШЫҒЫС</small><b>${r.solved?task.target:"?"}</b><small>${r.solved?"Сигнал дайын":"Тексергенде ашылады"}</small></div></div>`;
}
function renderTask(){page="game";const p=profile(),ts=tasks();if(viewIndex>=26&&!p.bonusStarted){renderResults();return;}const task=ts[viewIndex];if(!task){renderResults();return;}p.currentIndex=viewIndex;const r=L.recordFor(p,task.id),d=p.drafts[task.id]||(p.drafts[task.id]={}),s=L.STAGES[task.stage],num=task.stage===4?viewIndex-25:viewIndex+1,total=task.stage===4?6:26;const help=r.hints>0?task.hints.slice(0,Math.min(r.hints,2)).join(" "):"";const guide=p.route==="guide"&&task.stage!==3&&task.skills[0]?L.OPS[task.skills[0]].rule:"";
 app.innerHTML=`<div class="page-enter"><div class="game-header"><div><div class="eyebrow" style="margin-bottom:8px">ОҚУШЫ №${String(p.id).padStart(2,"0")} / ${e(L.ROUTES[p.route].name)}</div><h2>${s.name}</h2></div><button class="btn ghost" data-action="exit">Шығу және сақтау</button></div><div class="game-shell">${stageNav(task)}<section class="panel question-card" aria-labelledby="questionTitle"><div class="q-top"><span class="pill lime">${task.stage===4?"✦ Қосымша миссия":`0${task.stage+1} БӨЛІМ · ${s.time} МИН`}</span><span class="q-count">Тапсырма ${num} / ${total}</span></div><div class="q-progress"><span style="width:${100*(num-1)/total}%"></span></div><h2 id="questionTitle" tabindex="-1">${e(task.title)}</h2><p class="q-body">${e(task.body)}</p>${task.env?`<div class="env">${Object.entries(task.env).map(([k,v])=>`<span>${k} = ${v}</span>`).join("")}</div>`:""}${task.expr?`<div class="formula">${e(L.format(task.expr))}</div>`:""}${guide?`<div class="guide"><strong>Еске түсір:</strong> ${e(guide)}</div>`:""}${taskInput(task,r,d)}${help?`<div class="guide"><strong>Көмек ${Math.min(r.hints,2)}:</strong> ${e(help)}</div>`:""}<div id="feedbackRegion" tabindex="-1" aria-live="polite">${r.solved?`<div class="feedback success"><strong>✓ Дұрыс. Сигнал қалпына келді!</strong>${e(task.explanation)}</div>`:feedback?`<div class="feedback ${feedback.kind||""}"><strong>${e(feedback.title)}</strong>${e(feedback.text)}</div>`:""}</div><div class="task-actions"><div class="action-side">${task.stage!==3&&!r.solved?`<button class="btn ghost" data-action="hint" ${r.hints>=2?"disabled":""}>✧ Көмек${r.hints?" "+r.hints+"/2":""}</button>`:""}${r.attempts>=2&&!r.solved?'<button class="btn ghost" data-action="solution">Шешу жолы</button>':""}${viewIndex>0?'<button class="btn ghost" data-action="previous" aria-label="Алдыңғы тапсырма">←</button>':""}</div><button class="btn primary" data-action="${r.solved?"next":"check"}">${r.solved?(viewIndex===25||viewIndex===31?"Қорытынды →":"Келесі сигнал →"):"Жауапты тексеру"}</button></div>${task.stage===3?'<p class="small muted" style="margin-top:17px">Финалда алғашқы жауап бөлек тіркеледі. Қатені түзетіп, үйренуді жалғастыра аласың.</p>':""}</section>${modules()}</div></div>`;save();updateTimer();}
function showFeedback(title,text,kind=""){feedback={title,text,kind};renderTask();document.getElementById("feedbackRegion")?.focus({preventScroll:true});}
function verify(){const p=profile(),t=tasks()[viewIndex],d=p.drafts[t.id]||{},v=L.submit(p,t,d);if(v.empty){showFeedback("Жауап толық емес",v.message,"info");return;}if(v.correct){feedback=null;renderTask();document.getElementById("feedbackRegion")?.focus({preventScroll:true});return;}const specific=t.type==="trace"?`${v.wrong+1}-жолды қайта есепте. Жоғарыдағы мәнді дұрыс қолдандың ба?`:t.type==="circuit"?`Таңдаған кірістеріңде нәтиже ${v.actual} болады. Мақсат — ${t.target}. `+L.OPS[t.operator].rule:"Таңдаған нұсқаңды амалдың ережесімен салыстыр. Қажет болса, «Анықтама» немесе «Көмек» батырмасын аш.";showFeedback("Әзірге сәйкес келмеді. Қайта ойлан.",specific);}
function showRules(){const p=profile();if(page==="game"&&p){const t=tasks()[viewIndex];L.recordFor(p,t.id).hints=Math.max(1,L.recordFor(p,t.id).hints);save();}showModal("Алты логикалық амал",`<p class="small muted">1 — ақиқат, 0 — жалған. ∨ — кемінде бір ақиқат, ⊕ — дәл бір ақиқат. Жақшаларды ескер, ең ішкі өрнектен баста.</p><div class="rules-grid">${L.ORDER.map(k=>{const o=L.OPS[k];return `<div class="rule-card"><h3><span class="rule-symbol">${o.symbol}</span>${o.name}</h3><p>${o.rule}</p><div class="rule-examples">${o.examples}</div></div>`;}).join("")}</div><div class="teacher-note">Импликация — логикалық амал. «Егер А, онда В» өрнегін күнделікті себеп-салдар болжамымен шатастырма: оның мәні жоғарыдағы төрт ережемен анықталады.</div>`);}
function renderResults(){page="results";pauseCurrent();const p=profile(),s=L.summary(p);if(s.done<26){viewIndex=tasks().slice(0,26).findIndex(t=>!p.records[t.id]?.solved);renderTask();return;}const reviewed=s.finals.filter(x=>x.record?.firstCorrect!==true);app.innerHTML=`<div class="result-page page-enter"><section class="panel result-hero"><div class="result-mark">${p.reflection?"✦":"✓"}</div><div class="eyebrow" style="margin-bottom:12px">ОҚУШЫ №${String(p.id).padStart(2,"0")} · НЕГІЗГІ МИССИЯ ОРЫНДАЛДЫ</div><h1>Станция қайта іске қосылды.</h1><p class="muted">26 тапсырма аяқталды. Төменде финалдағы алғашқы жауаптарың көрінеді. Қате жауаптарды түзеткенің де сақталды.</p><div class="result-modules">${s.finals.map(({op,record})=>`<div class="result-op ${record?.firstCorrect?"":"review"}"><span class="symbol">${L.OPS[op].symbol}</span><small>${L.OPS[op].short}</small><b>${record?.firstCorrect?"Бірден дұрыс":"Түзетіп орындадым"}</b></div>`).join("")}</div><div class="hero-tags" style="justify-content:center;margin-top:0"><span class="pill">Бағыт: ${L.ROUTES[p.route].name}</span><span class="pill">Көмек қолданылған: ${s.help} тапсырма</span>${s.bonus?`<span class="pill lime">Қосымша: ${s.bonus}/6</span>`:""}</div><div class="result-buttons"><button class="btn primary" data-action="export-self">Нәтижені файлға сақтау ↓</button><button class="btn ghost" data-action="home">Басты бет</button>${p.reflection?'<button class="btn purple" data-action="bonus">✦ Қосымша орбита</button>':""}</div></section>${reviewed.length?`<section class="panel reflection"><h3>Келесі қадам</h3><p class="small muted">Осы амалдарды тағы бір мысалмен бекіт.</p>${reviewed.map(({op})=>`<div class="review-item"><strong>${L.OPS[op].name}:</strong> ${L.OPS[op].rule}</div>`).join("")}</section>`:""}<section class="panel reflection"><h3>${p.reflection?"Рефлексия сақталды ✓":"Миссия күнделігін толтыр"}</h3>${p.reflection?`<p class="small muted">Өзім сенімді қолданатын амал: <span class="accent">${L.OPS[p.reflection.op].name}</span></p><p class="saved-reflection">${e(p.reflection.text)}</p><p class="saved-reflection">${e(p.reflection.example)}</p><div class="result-buttons"><button class="btn ghost" data-action="edit-reflection">Жауапты толықтыру</button></div>`:`<form id="reflectionForm"><label class="field-label" for="reflectionOp">1. Қай амалды сенімді қолдана аласың?</label><select id="reflectionOp" required><option value="">Амалды таңда</option>${L.ORDER.map(k=>`<option value="${k}">${L.OPS[k].symbol} ${L.OPS[k].name}</option>`).join("")}</select><label class="field-label" for="reflectionText">2. НЕМЕСЕ мен XOR айырмасы қандай? Өз сөзіңмен түсіндір.</label><textarea id="reflectionText" maxlength="1500" required placeholder="Екі пікір де ақиқат болған жағдайды салыстыр…"></textarea><label class="field-label" for="reflectionExample">3. А = 1, В = 1 үшін А ∨ В және А ⊕ В мәндерін жаз. Себебін түсіндір.</label><textarea id="reflectionExample" maxlength="1500" required placeholder="А ∨ В = …, себебі …; А ⊕ В = …, себебі …"></textarea><p class="small muted" style="margin-top:12px">Мұғалім түсіндірмеңді оқып, кері байланыс береді. Мәтінге автоматты баға қойылмайды.</p><button class="btn primary" type="submit" style="margin-top:18px">Күнделікті сақтау ✓</button></form>`}</section>${!storageAvailable?'<div class="notice">Автоматты сақтау қолжетімсіз. Нәтижені міндетті түрде файлға жүктеп ал.</div>':""}</div>`;updateTimer();}
function saveReflection(event){event.preventDefault();const op=document.getElementById("reflectionOp").value,text=document.getElementById("reflectionText").value.trim(),example=document.getElementById("reflectionExample").value.trim();if(!L.ORDER.includes(op)||text.length<3||example.length<3){toast("Амалды таңда және екі түсіндірмені де толықтыр.");return;}const p=profile();p.reflection={op,text,example};p.completedAt=new Date().toISOString();p.updatedAt=p.completedAt;save();renderResults();toast("Күнделік сақталды. Енді соңғы нәтиже файлын жүктеп ал.");}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function resultBundle(profiles){tick();return{kind:"logika-stansiya-results",version:1,objective:"9.2.1.1",exportedAt:new Date().toISOString(),profiles:profiles.map(p=>({...p,paused:true,lastTickAt:0}))};}
function exportSelf(){const p=profile();if(!p){toast("Алдымен миссияны баста.");return;}download(`Logika_natizhe_${String(p.id).padStart(2,"0")}.json`,JSON.stringify(resultBundle([p]),null,2),"application/json;charset=utf-8");toast(p.reflection?"Нәтиже файлы дайын. Мұғалімге тапсыр.":"Аралық нәтиже жүктелді. Соңында рефлексиямен бірге қайта сақта.");}
function teacherPlan(){return `<div class="eyebrow" style="margin-bottom:12px">17 ОҚУШЫ / 9-СЫНЫП / 40 МИНУТ</div><h3>Логикалық амалдар. Практикалық жұмыс</h3><div class="teacher-note"><strong>Оқу мақсаты 9.2.1.1:</strong> ${OBJECTIVE}</div><p class="small">Ұсынылған ұйымдастыру: әр оқушы тізімдегі өз нөмірін таңдайды. Алғашқы үлгіні бірге талдаңыз, одан кейін жеке жұмыс жүргізіңіз. Әртүрлі құрылғыда бір нөмір қайталанбасын.</p><div class="lesson-list">${[["0–3","Нұсқаулық","Мақсат пен ережені түсіндіріңіз. «Бағыттаушы» — ережесі көрінетін көмек; «Зерттеуші» — қалыпты тапсырмалар; «Сарапшы» — құрама өрнектер. Бағытты оқушымен бірге таңдаңыз."],["3–8","Байланыс · 4 тапсырма","Ақиқат пен жалған, инверсия және ∧ белгісі. Әр оқушыдан бір шешімнің себебін сұраңыз."],["8–18","Алты модуль · 8 тапсырма","Барлық алты амал. 1 ∨ 1 мен 1 ⊕ 1 нәтижелерін салыстырыңыз. Импликацияның жалған болатын жалғыз жұбын тексеріңіз."],["18–28","Басқару зертханасы · 8 тапсырма","Жағдайға сай амал таңдау, логикалық пульт және кезеңдік есеп. Жұппен 1 минут талқылауға болады, бірақ әркім өз жауабын енгізеді."],["28–35","Соңғы сигнал · 6 тапсырма","Барлық бағытқа ортақ жеке тексеру. Алғашқы жауаптар тіркеледі; кейін қатені түзетуге болады. Шапшаң аяқтағандарға рефлексиядан соң қосымша орбита ашылады."],["35–40","Рефлексия және кері байланыс","Екі мәтіндік түсіндірмені оқытыңыз. Оқушылар соңғы JSON нәтижесін жүктейді. Қателескен амалға келесі сабақта бір ұқсас тапсырма беріңіз."]].map(([time,title,text])=>`<div class="lesson-row"><b>${time} мин</b><div><strong>${title}</strong>${text}</div></div>`).join("")}</div><h3 style="margin-top:24px">Нені бақылау керек?</h3><p class="small" style="margin-top:12px">Оқушы амалдың шартын дұрыс қолданады; құрама өрнектің аралық мәндерін табады; контекстке сай амал таңдайды; қатесін ережеге сүйеніп түзетеді. Бұл — жаттығу ойыны: балл немесе автоматты баға қойылмайды.</p><div class="teacher-note"><strong>Нақты кері байланыс үлгісі:</strong> «Сен ∨ нәтижесін дұрыс таптың. XOR-да дәл бір пікір ақиқат болуы керек. Енді А = 1, В = 1 жағдайын түзетіп, өз мысалыңмен түсіндір».</div><p class="small muted">Егер 17 жеке құрылғы болмаса, негізгі тапсырмаларды жұпта талқылап, соңғы алты сұрақты әр оқушыға жеке орындауға уақыт бөліңіз. Уақыт — ұсыныс; таймер біткенде ойын бұғатталмайды.</p><button class="btn ghost" data-action="download-html">Автономды HTML жүктеу ↓</button>`;}
function teacherRoster(){const ps=Object.values(state.profiles).filter(p=>p.started),finished=ps.filter(p=>L.summary(p).finished).length;let detail="";if(teacherId&&state.profiles[teacherId]){const p=state.profiles[teacherId],s=L.summary(p);detail=`<section class="panel reflection"><div class="section-top"><h3>Оқушы №${String(p.id).padStart(2,"0")}</h3><span class="pill">${L.ROUTES[p.route].name}</span></div><p class="small">Негізгі жұмыс: ${s.done}/26. Алғашқы әрекетте дұрыс: ${s.first}/26. Көмек қолданылған: ${s.help} тапсырма.</p><div class="table-scroll"><table><thead><tr><th>Финалдағы амал</th><th>Алғашқы жауап</th><th>Түзету</th></tr></thead><tbody>${s.finals.map(({op,record:r})=>`<tr><td>${L.OPS[op].symbol} ${L.OPS[op].name}</td><td>${!r||r.firstCorrect==null?"Әлі жоқ":r.firstCorrect?"Дұрыс":"Қате"}</td><td>${r?.solved?"Аяқталды":"Орындалмаған"}</td></tr>`).join("")}</tbody></table></div>${p.reflection?`<p class="small accent">Рефлексия · ${L.OPS[p.reflection.op].name}</p><p class="saved-reflection">${e(p.reflection.text)}</p><p class="saved-reflection">${e(p.reflection.example)}</p>`:'<p class="small muted">Рефлексия әлі сақталмаған.</p>'}</section>`;}
return `<h3>Сынып нәтижелері</h3><p class="small muted" style="margin-top:12px">Басталған: ${ps.length}/17 · Рефлексиямен аяқталған: ${finished}/17</p><div class="teacher-note">Мұнда осы құрылғыдағы және импортталған нәтижелер көрінеді. Басқа құрылғылардан дерек автоматты келмейді: оқушылардың JSON файлдарын «Нәтижелерді жинау» арқылы ашыңыз. Нөмір қайталанса, жаңарақ нұсқа сақталады.</div><div class="teacher-tools"><button class="btn primary" data-action="import">Нәтижелерді жинау ↑</button><button class="btn ghost" data-action="csv">Жиынтық кесте CSV ↓</button><button class="btn ghost" data-action="export-all">Барлық нәтиже JSON ↓</button></div><div class="student-grid">${Array.from({length:17},(_,i)=>{const p=state.profiles[i+1],s=p?L.summary(p):null;return `<button class="student-card ${s?.finished?"finished":""}" data-action="student-detail" data-id="${i+1}"><strong>Оқушы №${String(i+1).padStart(2,"0")}</strong><span class="small ${s?.finished?"accent":"muted"}">${!p?.started?"Басталмаған":s.finished?"✓ Аяқталды":s.done+"/26 · Орындалуда"}</span><small>${p?.started?L.ROUTES[p.route].name:"Нәтиже күтілуде"}</small></button>`;}).join("")}</div>${detail}<p class="small muted">Рефлексияны тексеру өлшемі: оқушы ∨ үшін «кемінде біреу», XOR үшін «дәл біреу» шартын түсіндіреді; А = В = 1 болғанда нәтижелердің 1 және 0 болуын негіздейді.</p>`;}
function answerKey(t){if(t.type==="choice")return t.choices.find(x=>x.value===t.answer)?.label||t.answer;if(t.type==="trace")return t.answer.join("; ");return t.operator==="imp"?"А = 1, В = 0":"А = 0, В = 0 немесе А = 1, В = 1";}
function teacherKeys(){const selected=Number(document.getElementById("keyStudent")?.value||state.selected),route=document.getElementById("keyRoute")?.value||state.profiles[selected]?.route||state.route;return `<h3>Жауаптар және түсіндірмелер</h3><p class="small muted" style="margin-top:12px">Таңдалған нөмір мен бағытқа сәйкес кілт. Оқушыларда мәндер мен жауап нұсқаларының реті өзгереді.</p><div class="setup-grid" style="margin-top:18px"><div><label class="field-label" for="keyStudent">Оқушы нөмірі</label><select id="keyStudent">${Array.from({length:17},(_,i)=>`<option value="${i+1}" ${i+1===selected?"selected":""}>№${i+1}</option>`).join("")}</select></div><div><label class="field-label" for="keyRoute">Бағыт</label><select id="keyRoute">${Object.entries(L.ROUTES).map(([k,r])=>`<option value="${k}" ${k===route?"selected":""}>${r.name}</option>`).join("")}</select></div></div>${keyTable(selected,route)}`;}
function keyTable(id,route){return `<div id="keyTable" class="table-scroll"><table><thead><tr><th>№</th><th>Тапсырма</th><th>Жауап / түсіндірме</th></tr></thead><tbody>${L.makeTasks(id,route).map((t,i)=>`<tr><td>${i<26?i+1:"Қ"+(i-25)}</td><td><strong>${t.title}</strong><br>${t.env?e(Object.entries(t.env).map(([k,v])=>k+"="+v).join(", ")):""}${t.expr?`<div class="key-expression">${e(L.format(t.expr))}</div>`:`<span>${e(t.body)}</span>`}</td><td><strong class="accent">${e(answerKey(t))}</strong><br>${e(t.explanation)}</td></tr>`).join("")}</tbody></table></div>`;}
function showTeacher(tab=teacherTab){teacherTab=tab;showModal("Мұғалім панелі",`<div class="teacher-tabs"><button class="btn ${tab==="plan"?"active":""}" data-action="teacher-tab" data-tab="plan">40 минуттық сабақ</button><button class="btn ${tab==="roster"?"active":""}" data-action="teacher-tab" data-tab="roster">17 оқушының нәтижесі</button><button class="btn ${tab==="keys"?"active":""}" data-action="teacher-tab" data-tab="keys">Жауап кілті</button></div>${tab==="plan"?teacherPlan():tab==="roster"?teacherRoster():teacherKeys()}`);}
function csvCell(s){let v=String(s??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function exportCSV(){const rows=[["Оқушы нөмірі","Бағыт","Негізгі тапсырма","Алғашқыда дұрыс","Көмек қолданылған","ЖӘНЕ алғашқы жауап","НЕМЕСЕ алғашқы жауап","ЕМЕС алғашқы жауап","XOR алғашқы жауап","Импликация алғашқы жауап","Эквиваленттілік алғашқы жауап","Рефлексия: айырмашылық","Рефлексия: мысал","Күй"]];for(let i=1;i<=17;i++){const p=state.profiles[i];if(!p?.started){rows.push([i,"","0/26","","","","","","","","","","","Басталмаған"]);continue;}const s=L.summary(p);rows.push([i,L.ROUTES[p.route].name,s.done+"/26",s.first+"/26",s.help,...s.finals.map(x=>x.record?.firstCorrect==null?"Әлі жоқ":x.record.firstCorrect?"Дұрыс":"Қате"),p.reflection?.text||"",p.reflection?.example||"",s.finished?"Аяқталды":"Орындалуда"]);}download("Logika_17_okushy_esep.csv","\ufeff"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),"text/csv;charset=utf-8");}
async function importResults(files){tick();let imported=0,skipped=0,errors=[];for(const f of Array.from(files).slice(0,40)){try{if(f.size>5*1024*1024)throw Error("Файл тым үлкен.");const profiles=L.readExport(JSON.parse(await f.text()));for(const p of profiles){const old=state.profiles[p.id];if(old&&Date.parse(old.updatedAt)>=Date.parse(p.updatedAt)){skipped++;continue;}state.profiles[p.id]=p;imported++;}}catch(err){errors.push(f.name+": "+(err.message||"Файл оқылмады."));}}save();showTeacher("roster");toast(`${imported} нәтиже қабылданды.${skipped?" "+skipped+" ескі не бірдей нұсқа өткізіліп жіберілді.":""}${errors.length?" "+errors.length+" файл қабылданбады.":""}`);if(errors.length){const div=document.createElement("div");div.className="notice";div.textContent=errors.join("\n");modal.querySelector(".modal-body").appendChild(div);}}
document.addEventListener("click",async event=>{const button=event.target.closest("[data-action]");if(!button||button.disabled)return;const action=button.dataset.action;
 if(action==="home"||action==="exit"){pauseCurrent();feedback=null;renderHome();scrollTop();}
 else if(action==="route"){state.route=button.dataset.route;save();renderHome();}
 else if(action==="intro")showIntro();else if(action==="start")start();else if(action==="resume")resume();else if(action==="close")closeModal();
 else if(action==="rules")showRules();else if(action==="teacher")showTeacher();else if(action==="teacher-tab")showTeacher(button.dataset.tab);
 else if(action==="pause"){const p=profile();if(!p?.started){toast("Таймер миссияны бастағанда қосылады.");return;}if(p.paused&&p.remaining>0){p.paused=false;p.lastTickAt=Date.now();toast("Таймер жалғасты.");}else{pauseCurrent();toast("Таймер кідірді. Қайта бассаң, жалғасады.");}save();updateTimer();}
 else if(action==="fullscreen"){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen();else toast("Бұл браузерде толық экран қолжетімсіз.");}catch{toast("Бұл терезеде толық экран қолжетімсіз.");}}
 else if(action==="choose"){const p=profile(),t=tasks()[viewIndex];(p.drafts[t.id]||(p.drafts[t.id]={})).choice=button.dataset.value;feedback=null;renderTask();document.querySelector('.answer.selected')?.focus({preventScroll:true});}
 else if(action==="switch"){const p=profile(),t=tasks()[viewIndex],which=button.dataset.var,value=button.dataset.value;(p.drafts[t.id]||(p.drafts[t.id]={}))[which]=value;feedback=null;renderTask();document.querySelector('[data-var="'+which+'"][data-value="'+value+'"]')?.focus({preventScroll:true});}
 else if(action==="check")verify();
 else if(action==="next"){const p=profile(),t=tasks()[viewIndex];if(!p.records[t.id]?.solved)return;feedback=null;if(viewIndex===25||viewIndex===31){if(viewIndex===31)p.bonusStarted=false;renderResults();}else{viewIndex++;renderTask();document.getElementById("questionTitle")?.focus({preventScroll:true});}scrollTop();}
 else if(action==="previous"){viewIndex=Math.max(0,viewIndex-1);feedback=null;renderTask();}
 else if(action==="stage"){viewIndex=Number(button.dataset.index);feedback=null;renderTask();}
 else if(action==="hint"){const p=profile(),t=tasks()[viewIndex],r=L.recordFor(p,t.id);r.hints=Math.min(2,r.hints+1);p.updatedAt=new Date().toISOString();feedback=null;renderTask();}
 else if(action==="solution"){const p=profile(),t=tasks()[viewIndex];L.recordFor(p,t.id).hints=3;showFeedback("Шешу жолын талда",t.explanation,"info");}
 else if(action==="export-self")exportSelf();else if(action==="export-all"){const ps=Object.values(state.profiles).filter(p=>p.started);if(!ps.length){toast("Әзірге сақталған нәтиже жоқ.");return;}download("Logika_synyp_natizheleri.json",JSON.stringify(resultBundle(ps),null,2),"application/json;charset=utf-8");}
 else if(action==="csv")exportCSV();else if(action==="import"){pauseCurrent();document.getElementById("importFiles").click();}
 else if(action==="student-detail"){teacherId=Number(button.dataset.id);showTeacher("roster");}
 else if(action==="bonus"){const p=profile();p.bonusStarted=true;const ts=tasks();viewIndex=ts.findIndex((t,i)=>i>=26&&!p.records[t.id]?.solved);if(viewIndex<0){viewIndex=26;toast("Барлық қосымша тапсырма орындалды. Шешімдерді қайталай аласың.");}p.paused=p.remaining===0;p.lastTickAt=p.paused?0:Date.now();feedback=null;renderTask();scrollTop();}
 else if(action==="edit-reflection"){const p=profile(),old=p.reflection;const el=app.querySelector(".reflection:last-of-type");p.reflection=null;renderResults();document.getElementById("reflectionOp").value=old.op;document.getElementById("reflectionText").value=old.text;document.getElementById("reflectionExample").value=old.example;p.reflection=old;save();document.getElementById("reflectionText").focus();}
 else if(action==="download-html")download("Logika_stansiyasy_9_synyp_17.html",SOURCE_HTML,"text/html;charset=utf-8");
 else if(action==="restart")showModal("Оқушы №"+String(state.selected).padStart(2,"0")+" · жаңадан бастау",'<p>Осы нөмірдің сақталған жауаптары мен рефлексиясы өшіріледі. Қажет болса, алдымен нәтижені файлға сақта.</p><div class="result-buttons"><button class="btn ghost" data-action="export-self">Нәтижені сақтау ↓</button><button class="btn ghost" data-action="close">Болдырмау</button><button class="btn danger" data-action="confirm-restart">Осы нөмірді тазарту</button></div>');
 else if(action==="confirm-restart"){pauseCurrent();delete state.profiles[state.selected];save();closeModal();renderHome();toast("Осы нөмір тазартылды. Жаңа бағыт таңдай аласың.");}
});
document.addEventListener("change",event=>{const x=event.target;if(x.id==="studentSelect"){pauseCurrent();state.selected=Number(x.value);state.route=state.profiles[state.selected]?.route||"explorer";save();renderHome();}
 else if(x.dataset.trace!==undefined){const p=profile(),t=tasks()[viewIndex],d=p.drafts[t.id]||(p.drafts[t.id]={});(d.trace||(d.trace=[]))[Number(x.dataset.trace)]=x.value;save();}
 else if(x.id==="keyStudent"||x.id==="keyRoute"){const id=Number(document.getElementById("keyStudent").value),route=document.getElementById("keyRoute").value;document.getElementById("keyTable").outerHTML=keyTable(id,route);}
 else if(x.id==="importFiles"){importResults(x.files);x.value="";}
});
document.addEventListener("submit",event=>{if(event.target.id==="reflectionForm")saveReflection(event);});
modal.addEventListener("click",event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
window.addEventListener("beforeunload",()=>{tick();save();});document.addEventListener("visibilitychange",()=>{if(document.hidden){tick();save();}});
load();renderHome();setInterval(()=>{tick();if(!profile()?.paused&&Math.floor(Date.now()/1000)%10===0)save();},1000);
})();
</script>
