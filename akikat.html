<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ақиқат кестелері</title>
<style>
:root{--bg:#f7f7f5;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#d8d8d2;--ac:#2563eb;--one:#dcfce7;--res:#dbeafe;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e6e6e6;--mut:#9aa0a6;--card:#1d2026;--bd:#363a42;--ac:#60a5fa;--one:#14532d;--res:#1e3a8a;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e6e6e6;--mut:#9aa0a6;--card:#1d2026;--bd:#363a42;--ac:#60a5fa;--one:#14532d;--res:#1e3a8a;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:640px}
h1{font-size:22px;margin:0 0 4px}
.s{margin:0 0 12px;color:var(--mut);font-size:14px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input{width:100%;box-sizing:border-box;padding:12px;font-size:20px;font-family:ui-monospace,monospace}
button{padding:8px 12px;cursor:pointer}
.ops{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ops button{min-width:44px;font-size:18px}
.ops button.v{color:var(--ac);font-weight:700}
.ex{font-size:13px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:14px;font-family:ui-monospace,monospace;padding:6px 10px}
#err{color:var(--bad);min-height:22px;margin:8px 0;font-size:14px}
#wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-family:ui-monospace,monospace;font-size:15px}
th,td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:13px;background:var(--bg)}
td.one{background:var(--one)}
th.r,td.r{border-left:2px solid var(--ac);font-weight:700}
th.r{background:var(--res)}
th.v,td.v{border-right:2px solid var(--bd)}
#sum{margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;font-size:15px;display:none}
.leg{font-size:12px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<h1>Ақиқат кестелері</h1>
<p class="s">Логикалық өрнекті енгіз, кесте қадам бойынша өзі құрылады.</p>
<input id="f" value="¬(A ∨ B)" autocomplete="off" autocapitalize="characters" spellcheck="false">
<div class="ops">
  <button class="v">A</button><button class="v">B</button><button class="v">C</button>
  <button>¬</button><button>∧</button><button>∨</button><button>→</button><button>≡</button><button>⊕</button>
  <button>(</button><button>)</button><button id="bs">⌫</button>
</div>
<div class="ex">Мысалдар</div>
<div class="chips" id="chips"></div>
<div id="err"></div>
<div id="wrap"></div>
<div id="sum"></div>
<div class="leg">¬ ЖОҚ, ∧ ЖӘНЕ, ∨ НЕМЕСЕ, → салдар, ≡ мәндестік, ⊕ терістеуші немесе. Пернетақтадан енгізуге болады: ! & | -> ==. Әрекеттер реті: ¬, ∧, ∨, ⊕, →, ≡. 4 айнымалыға дейін.</div>

<script>
var $=function(i){return document.getElementById(i)};
var EX=["A ∧ B","A ∨ B","¬(A ∨ B)","¬A ∧ ¬B","A → B","¬A ∨ B","(A ∨ B) ∧ ¬(A ∧ B)","A ∨ ¬A","(A → B) ∧ (B → C)"];
function norm(s){
  s=s.replace(/<->|<=>|==|≡/g,"≡").replace(/->|=>|→/g,"→");
  var m={"!":"¬","~":"¬","&":"∧","*":"∧","|":"∨","+":"∨","^":"⊕","а":"A","в":"B","с":"C","А":"A","В":"B","С":"C","a":"A","b":"B","c":"C","d":"D"};
  var r="";for(var i=0;i<s.length;i++){var c=s[i];r+=m[c]||c.toUpperCase()}
  return r.replace(/\s+/g,"");
}
function parse(src){
  var p=0;
  function peek(){return src[p]}
  function eat(c){if(src[p]===c){p++;return true}return false}
  function eq(){var l=imp();while(eat("≡"))l={t:"b",o:"≡",l:l,r:imp()};return l}
  function imp(){var l=xor();if(eat("→"))return{t:"b",o:"→",l:l,r:imp()};return l}
  function xor(){var l=or();while(eat("⊕"))l={t:"b",o:"⊕",l:l,r:or()};return l}
  function or(){var l=and();while(eat("∨"))l={t:"b",o:"∨",l:l,r:and()};return l}
  function and(){var l=nt();while(eat("∧"))l={t:"b",o:"∧",l:l,r:nt()};return l}
  function nt(){
    if(eat("¬"))return{t:"n",c:nt()};
    if(eat("(")){var e=eq();if(!eat(")"))throw"Жақша жабылған жоқ )";return e}
    var c=peek();
    if(c&&/[A-Z]/.test(c)){p++;return{t:"v",n:c}}
    if(c===undefined)throw"Өрнек аяқталмай қалды: бірдеңe жетіспейді";
    throw"Түсініксіз таңба «"+c+"»";
  }
  var e=eq();
  if(p<src.length)throw src[p]===")"?"Артық жабылатын жақша":"Артық таңба «"+src[p]+"»";
  return e;
}
function str(n,top){
  if(n.t==="v")return n.n;
  if(n.t==="n")return"¬"+str(n.c,false);
  var s=str(n.l,false)+" "+n.o+" "+str(n.r,false);
  return top?s:"("+s+")";
}
function ev(n,env){
  if(n.t==="v")return env[n.n];
  if(n.t==="n")return 1-ev(n.c,env);
  var a=ev(n.l,env),b=ev(n.r,env);
  switch(n.o){case"∧":return a&b;case"∨":return a|b;case"⊕":return a^b;case"→":return(1-a)|b;default:return a===b?1:0}
}
function subs(n,list,seen){
  if(n.t==="v")return;
  if(n.t==="n")subs(n.c,list,seen);else{subs(n.l,list,seen);subs(n.r,list,seen)}
  var k=str(n,false);if(!seen[k]){seen[k]=1;list.push(n)}
}
function vars(n,o){if(n.t==="v")o[n.n]=1;else if(n.t==="n")vars(n.c,o);else{vars(n.l,o);vars(n.r,o)}}
function build(){
  var raw=$("f").value,err=$("err");err.textContent="";$("sum").style.display="none";
  if(!raw.trim()){$("wrap").innerHTML="";return}
  var ast;
  try{ast=parse(norm(raw))}catch(e){err.textContent=e;$("wrap").innerHTML="";return}
  var vo={};vars(ast,vo);var vs=Object.keys(vo).sort();
  if(vs.length>4){err.textContent="Айнымалылар тым көп (максимум 4)";$("wrap").innerHTML="";return}
  var cols=[];subs(ast,cols,{});
  if(!cols.length){err.textContent="Кем дегенде бір операция қос";$("wrap").innerHTML="";return}
  var last=cols.length-1,rows=1<<vs.length,ones=0;
  var h="<table><tr>";
  vs.forEach(function(v,i){h+='<th class="'+(i===vs.length-1?"v":"")+'">'+v+"</th>"});
  cols.forEach(function(c,i){h+='<th class="'+(i===last?"r":"")+'">'+str(c,i===last)+"</th>"});
  h+="</tr>";
  for(var r=0;r<rows;r++){
    var env={};h+="<tr>";
    vs.forEach(function(v,i){var b=(r>>(vs.length-1-i))&1;env[v]=b;h+='<td class="'+(i===vs.length-1?"v":"")+'">'+b+"</td>"});
    cols.forEach(function(c,i){var x=ev(c,env);if(i===last)ones+=x;
      h+='<td class="'+(x?"one ":"")+(i===last?"r":"")+'">'+x+"</td>"});
    h+="</tr>";
  }
  $("wrap").innerHTML=h+"</table>";
  var t=ones===rows?"Тепе-тең ақиқат өрнек (тавтология): әрқашан 1.":ones===0?"Тепе-тең жалған өрнек (қайшылық): әрқашан 0.":"Өрнек орындалады: "+rows+" жолдың "+ones+"-інде 1-ге тең.";
  $("sum").textContent=t;$("sum").style.display="block";
}
[].forEach.call(document.querySelectorAll(".ops button"),function(b){
  if(b.id==="bs")b.onclick=function(){var f=$("f");f.value=f.value.replace(/\s*.$/,"");build()};
  else b.onclick=function(){var f=$("f");var t=b.textContent,op=/[∧∨→≡⊕]/.test(t);f.value+=op?" "+t+" ":t;build()};
});
EX.forEach(function(e){var b=document.createElement("button");b.textContent=e;b.onclick=function(){$("f").value=e;build()};$("chips").appendChild(b)});
$("f").oninput=build;
build();
</script>
</body>
</html>
