<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цезарь шифрі</title>
<style>
:root{--bg:#f7f7f5;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#d8d8d2;--ac:#2563eb;--hl:#fde68a;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e6e6e6;--mut:#9aa0a6;--card:#1d2026;--bd:#363a42;--ac:#60a5fa;--hl:#854d0e;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e6e6e6;--mut:#9aa0a6;--card:#1d2026;--bd:#363a42;--ac:#60a5fa;--hl:#854d0e;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:600px}
h1{font-size:22px;margin:0 0 4px}
.s{margin:0 0 12px;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,textarea{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{padding:10px 14px;cursor:pointer}
.tabs button{flex:1}
.tabs button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
textarea{width:100%;box-sizing:border-box;padding:10px;resize:vertical;min-height:70px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;min-height:44px;word-break:break-word;font-size:18px}
.lab{font-size:13px;color:var(--mut);margin-top:10px}
input[type=range]{width:100%}
.sh{font-size:20px;font-weight:700;text-align:center}
#strip{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
.rw{display:flex;gap:2px;margin:2px 0;width:max-content}
.cl{width:24px;text-align:center;font-family:ui-monospace,monospace;font-size:16px;border-radius:4px;padding:2px 0}
.cl.h{background:var(--hl)}
.arr{font-size:12px;color:var(--mut);text-align:center}
#msg{min-height:24px;font-weight:600;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>Цезарь шифрі</h1>
<p class="s">Әрбір әріп алфавит бойынша бірнеше қадам кейін тұрған әріппен алмастырылады.</p>
<div class="tabs"><button id="t1" class="on">Шифрлау</button><button id="t2">Шифрын ашу</button></div>

<div id="p1">
  <div class="lab">Сенің мәтінің</div>
  <textarea id="inp">Сәлем, әлем!</textarea>
</div>
<div id="p2" style="display:none">
  <div class="lab">Ұсталған хабарлама</div>
  <div class="box" id="secret"></div>
  <div class="s">Мәтін оқылатын болғанша жылжу қадамын таңда.</div>
</div>

<div class="lab" id="shl">Жылжу қадамы</div>
<div class="sh" id="shv">3</div>
<input type="range" id="sh" min="1" max="41" value="3">

<div class="lab">Алфавит: жоғарғы жол — бастапқы, төменгі жол — өзгеретін</div>
<div id="strip"></div>

<div class="lab" id="outl">Шифр</div>
<div class="box" id="out"></div>
<div id="msg"></div>
<div class="row">
  <button id="new" class="p" style="display:none">Жаңа хабарлама</button>
  <button id="show" style="display:none">Жауапты көрсету</button>
</div>

<script>
var A="АӘБВГҒДЕЁЖЗИЙКЛМНҢОӨПРСТУҰҮФХҺЦЧШЩЫІЭЮЯ",N=A.length,mode=1,plain="",key=0,revealed=false;
var MSG=["Информатика деректер туралы ғылым","Шифрын рим қолбасшысы ойлап тапқан","Компьютер тек нөлдер мен бірліктерді түсінеді","Құпиясөздеріңді сақта","Алгоритм бұл дәл нұсқаулық","Жақсы бағдарламашы есеп шығарғанды ұнатады"];
var $=function(i){return document.getElementById(i)};
function shift(t,k){
  var r="";
  for(var i=0;i<t.length;i++){
    var ch=t[i],u=ch.toUpperCase(),p=A.indexOf(u);
    if(p<0){r+=ch;continue}
    var n=A[(p+k+N)%N];
    r+=(ch===u)?n:n.toLowerCase();
  }
  return r;
}
function strip(k){
  var a="",b="";
  for(var i=0;i<N;i++){
    a+='<span class="cl'+(i===0?" h":"")+'">'+A[i]+'</span>';
    b+='<span class="cl'+(i===0?" h":"")+'">'+A[(i+k)%N]+'</span>';
  }
  $("strip").innerHTML='<div class="rw">'+a+'</div><div class="arr">↓ '+k+' қадамға жылжу</div><div class="rw">'+b+'</div>';
}
function upd(){
  var k=+$("sh").value;$("shv").textContent=k;strip(k);var m=$("msg");
  if(mode===1){$("out").textContent=shift($("inp").value,k)}
  else{
    var t=shift(plain,-k);$("out").textContent=t;
    if(k===key){m.style.color="var(--ok)";m.textContent="Шифры ашылды! 🎉 Шифр кілті: "+key}
    else{m.style.color="var(--mut)";m.textContent=revealed?"":"Әзірге оқылмайды..."}
  }
}
function newMsg(){
  var t=MSG[Math.floor(Math.random()*MSG.length)];
  key=1+Math.floor(Math.random()*(N-1));revealed=false;
  plain=shift(t,key);
  $("secret").textContent=plain;$("sh").value=1;upd();
}
function setMode(m){
  mode=m;$("t1").className=m===1?"on":"";$("t2").className=m===2?"on":"";
  $("p1").style.display=m===1?"block":"none";$("p2").style.display=m===2?"block":"none";
  $("new").style.display=$("show").style.display=m===2?"inline-block":"none";
  $("outl").textContent=m===1?"Шифр":"Дешифрлеу";$("msg").textContent="";
  if(m===2)newMsg();else{$("sh").value=3;upd()}
}
$("t1").onclick=function(){setMode(1)};
$("t2").onclick=function(){setMode(2)};
$("sh").oninput=upd;$("inp").oninput=upd;
$("new").onclick=newMsg;
$("show").onclick=function(){revealed=true;$("sh").value=key;upd();$("msg").style.color="var(--mut)";$("msg").textContent="Дұрыс жылжу қадамы: "+key};
setMode(1);
</script>
</body>
</html>
